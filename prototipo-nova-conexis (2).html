function decode(b){ return new TextDecoder().decode(Uint8Array.from(atob(b), c=>c.charCodeAt(0))); }
const frame = document.getElementById('frame');
function show(s){
  if(!SCREENS[s]) s='inicio';
  frame.srcdoc = decode(SCREENS[s]);
  if(location.hash.slice(1)!==s) history.replaceState(null,'','#'+s);
}
window.addEventListener('message', e => { if(e.data && e.data.navTo) show(e.data.navTo); });
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show((location.hash||'#inicio').slice(1));
</script>
